<!DOCTYPE html>
<html lang="fi">
    <body>
        <a href="https://hotellilahde.fi/" target="_blank">
            <h3>Hotelli Lähde</h3>
        </a>
        <div class="flexrow" onclick="onCopyClick(event.currentTarget)">
            <pre>$HOTELLILAHDEKOODI</pre><img src="/images/copyicon.png" height="12" width="12" />
        </div>
        <a
            href="https://www.sokoshotels.fi/hotellit/lappeenranta/original-sokos-hotel-lappee" target="_blank"
        >
            <h3>Sokos Hotel Lappee</h3>
        </a>
         <div class="flexrow" onclick="onCopyClick(event.currentTarget)">
             <pre>$HOTELLILAPPEEKOODI</pre><img src="/images/copyicon.png" height="12" width="12" />
            </div>
    </body>
    <style>
        body {
            background-color: white;
            padding: 4px;
        }
        .flexrow {
            display: flex;
            flex-direction: row;
            align-items: center;
            cursor: pointer;
            gap: 5px;
        }
    </style>
    <script>
        function onCopyClick(div) {
            const code = div.querySelector('pre').textContent;
            navigator.clipboard.writeText(code).then(() => {
                const icon = div.querySelector('img,span')
                if (!icon) return;
                div.removeChild(icon);
                const newChild = document.createElement('span');
                newChild.textContent = '✅';
                div.appendChild(newChild);
            })
        }
    </script>
</html>
